name: build-apk
on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip
        run: |
          mkdir proj
          [ -f "kelid-sim.zip" ] && unzip -qo "kelid-sim.zip" -d proj
          for n in $(seq 1 30); do
            [ -f "kelid-sim ($n).zip" ] && unzip -qo "kelid-sim ($n).zip" -d proj
          done
          grep -c "dispatchGesture" proj/app/src/main/java/com/kelidsim/ClickService.kt || true
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - name: Build
        working-directory: proj
        run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: KelidSim-apk
          path: proj/app/build/outputs/apk/debug/app-debug.apk
